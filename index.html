  <script>
    (function() {
      var bar = document.getElementById('scrollProgress');
      if (!bar) return;
      var done = false;
      var resources = [];
      Array.prototype.forEach.call(document.scripts, function(s) { if (s.src) resources.push(s); });
      Array.prototype.forEach.call(document.querySelectorAll('link[rel="stylesheet"]'), function(l) { resources.push(l); });
      Array.prototype.forEach.call(document.images, function(i) { resources.push(i); });
      var total = resources.length;
      var timer = setInterval(function() {
        if (done) return;
        var loadedCount = 0;
        try {
          loadedCount = performance.getEntriesByType('resource').filter(function(e) { return e.responseEnd > 0; }).length;
        } catch (e) { loadedCount = total; }
        var pct = total > 0 ? Math.min(0.9, loadedCount / total) : 0.6;
        bar.style.width = (pct * 100).toFixed(2) + '%';
      }, 200);
      function finish() {
        if (done) return;
        done = true;
        clearInterval(timer);
        bar.style.width = '100%';
        setTimeout(function() {
          bar.classList.add('done');
          setTimeout(function() { if (bar.parentNode) bar.parentNode.removeChild(bar); }, 400);
        }, 150);
      }
      window.addEventListener('load', finish);
      setTimeout(finish, 5000);
    })();
  </script>
